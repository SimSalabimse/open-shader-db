[workspace]
resolver = "2"
members = [
    "crates/sodb",
    "crates/coverage",
    "crates/steam",
    "crates/records",
    "crates/shaders",
    "crates/rebuild",
    "crates/upload",
    "crates/osdb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Simsalabim"]
repository = "https://github.com/SimSalabimse/open-shader-db"
homepage = "https://github.com/SimSalabimse/open-shader-db"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "limits", "blob"] }
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` parses f64 with correct rounding. The record loader
# hashes those bits, so this feature is part of the hash input.
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
# MIT OR Apache-2.0. Unix-only; used for O_NONBLOCK so FIFO opens do not hang.
libc = "0.2"
# Unlicense / MIT. Same device+inode (Unix) / file index (Windows) without unsafe in this repo.
same-file = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
