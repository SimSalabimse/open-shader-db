[workspace]
resolver = "2"
members = ["crates/sodb", "crates/osdb-cli", "crates/steam"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Simsalabim"]
repository = "https://github.com/SimSalabimse/open-shader-db"
homepage = "https://github.com/SimSalabimse/open-shader-db"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "limits"] }
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# MIT OR Apache-2.0. Unix-only; used for O_NONBLOCK so FIFO opens do not hang.
libc = "=0.2.177"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
